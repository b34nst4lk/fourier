<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fourier Sketch</title>
    <style>
      /* Theme: parchment cartography — lifted from projects/cartographer's
         solo build (dist/cartographers-solo.html). Ink on aged paper, serif
         small-caps headings, 1.5px ink borders, hard offset "pressed"
         shadows. Supersedes the dark-only palette (PLAN #15 — see the
         ruling note there). */
      :root {
        color-scheme: light;
        --ink: #46351f;
        --ink-faint: #8a764f;
        --parchment: #f3ead2;
        --parchment-dark: #e4d6b4;
        --page: #d8c9a5;
        --accent: #96621f;
        --danger: #a4372a;
        --coin: #d9a92f;
        --water: #82a7ba;
      }
      body {
        margin: 0;
        background: var(--page)
          radial-gradient(ellipse at 50% 30%, #e3d6b4 0%, var(--page) 70%);
        background-attachment: fixed;
        color: var(--ink);
        font-family: "Iowan Old Style", Georgia, "Times New Roman", serif;
        font-size: 14px;
      }
      .app {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1.15fr 0.9fr;
        gap: 10px;
        height: 100vh;
        box-sizing: border-box;
        padding: 10px;
      }
      /* large screens: ~10% side margins — panels fill edge-to-edge of the
         content area between them */
      @media (min-width: 1100px) {
        .app {
          padding-left: 10%;
          padding-right: 10%;
        }
      }
      .panel {
        position: relative;
        display: flex;
        flex-direction: column;
        border: 1.5px solid var(--ink);
        border-radius: 10px;
        background: var(--parchment);
        box-shadow: 0 2px 0 rgba(70, 53, 31, 0.35);
        overflow: hidden;
      }
      .terms {
        grid-column: 1 / 3;
      }
      .panel-label {
        position: absolute;
        top: 9px;
        left: 12px;
        font-size: 12px;
        font-variant-caps: small-caps;
        letter-spacing: 0.18em;
        color: var(--ink-faint);
        user-select: none;
        z-index: 2;
      }
      .toolbar {
        display: flex;
        gap: 6px;
        padding: 6px 10px;
        margin-left: 88px;
      }
      .toolbar button {
        background: var(--parchment);
        border: 1.5px solid var(--ink);
        color: var(--ink);
        border-radius: 6px;
        padding: 3px 10px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        box-shadow: 0 2px 0 rgba(70, 53, 31, 0.35);
        transition: transform 0.05s ease;
      }
      .toolbar button:hover:not(:disabled) {
        background: #faf3e0;
      }
      .toolbar button:active:not(:disabled) {
        transform: translateY(1px);
        box-shadow: none;
      }
      .toolbar button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .toolbar button.active {
        border-color: var(--accent);
        color: var(--accent);
      }
      .sketch-svg {
        flex: 1;
        width: 100%;
        display: block;
        cursor: crosshair;
        user-select: none;
        -webkit-user-select: none;
      }
      .sketch-bg {
        fill: var(--parchment);
      }
      /* the pen line: sepia, like a mapmaker's ink */
      .sketch-path {
        fill: none;
        stroke: var(--accent);
        stroke-width: 0.4;
        stroke-linejoin: round;
      }
      /* dots are the cartographer's coins */
      .dot {
        fill: var(--coin);
        stroke: var(--parchment);
        stroke-width: 0.15;
        cursor: grab;
      }
      .placeholder {
        margin: auto;
        padding: 48px;
        color: var(--ink-faint);
        font-style: italic;
        font-size: 13px;
        letter-spacing: 0.02em;
      }

      .fourier-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .fourier-canvas {
        flex: 1;
        width: 100%;
        min-height: 0;
        display: block;
      }
      .circles-slider {
        flex: 1;
        accent-color: var(--accent);
      }
      .slider-label {
        align-self: center;
        color: var(--ink-faint);
        font-size: 12px;
      }
      .count-label {
        align-self: center;
        min-width: 3ch;
        text-align: right;
        color: var(--accent);
      }

      .terms-scroll {
        flex: 1;
        overflow-y: auto;
      }
      .term-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      .term-table th {
        position: sticky;
        top: 0;
        background: var(--parchment);
        color: var(--ink-faint);
        font-variant-caps: small-caps;
        letter-spacing: 0.08em;
        text-align: left;
        padding: 4px 10px;
        font-weight: normal;
        z-index: 1;
      }
      .term-table td {
        padding: 2px 10px;
        border-top: 1px solid var(--parchment-dark);
        white-space: nowrap;
      }
      .term-table tr.cut {
        opacity: 0.32;
      }
      .spark {
        width: 108px;
        height: 16px;
        display: block;
      }
      /* waveforms drawn in water-wash, like rivers on the map */
      .spark path {
        fill: none;
        stroke: var(--water);
        stroke-width: 1;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { main } from "/build/dev/javascript/fourier_sketch/fourier_sketch.mjs";
      main();
    </script>
  </body>
</html>
