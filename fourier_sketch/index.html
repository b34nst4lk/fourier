      /* Theme: parchment cartography — lifted from projects/cartographer's
         solo build (dist/cartographers-solo.html). Ink on aged paper, serif
         small-caps headings, 1.5px ink borders, hard offset "pressed"
         shadows. Supersedes the dark-only palette (PLAN #15 — see the
         ruling note there). */
      :root {
        color-scheme: light;
        --ink: #46351f;
        --ink-faint: #8a764f;
        --parchment: #f3ead2;
        --parchment-dark: #e4d6b4;
        --page: #d8c9a5;
        --accent: #96621f;
        --danger: #a4372a;
        --coin: #d9a92f;
        --water: #82a7ba;
      }
      body {
        margin: 0;
        background: var(--page)
          radial-gradient(ellipse at 50% 30%, #e3d6b4 0%, var(--page) 70%);
        background-attachment: fixed;
        color: var(--ink);
        font-family: "Iowan Old Style", Georgia, "Times New Roman", serif;
        font-size: 14px;
        height: 100vh;
        /* the flex root: gives .sheet its definite viewport height */
        display: flex;
        overflow: hidden;
      }
      /* the sheet: the |10%| 80% |10%| column — title, panels, terms all
         live inside it; height viewport-driven, width fills the margins */
      .sheet {
        width: 80%;
        flex: 1;
        min-height: 0;
        margin: 12px 10%;
        display: flex;
        flex-direction: column;
      }
      /* page brand — f-sketch, written like one continuous epicycle stroke */
      .page-title {
        flex: none;
        font-family: "Sacramento", "Iowan Old Style", Georgia, cursive;
        font-size: 32px;
        line-height: 1.05;
        color: var(--ink);
        padding: 2px 6px 8px 0;
      }
      /* Lustre mounts .app into #app — pass it through to the sheet's
         flex layout untouched */
      #app {
        display: contents;
      }
      .app {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1.15fr 0.9fr;
        gap: 10px;
        flex: 1;
        min-height: 0;
        box-sizing: border-box;
      }
      .panel {
        position: relative;
        display: flex;
        flex-direction: column;
        border: 1.5px solid var(--ink);
        border-radius: 10px;
        background: var(--parchment);
        box-shadow: 0 2px 0 rgba(70, 53, 31, 0.35);
        overflow: hidden;
      }
      .terms {
        grid-column: 1 / 3;
      }
      .panel-label {
        position: absolute;
        top: 9px;
        left: 12px;
        font-size: 12px;
        font-variant-caps: small-caps;
        letter-spacing: 0.18em;
        color: var(--ink-faint);
        user-select: none;
        z-index: 2;
        /* parchment tag: scrolling content passes underneath cleanly */
        background: var(--parchment);
        padding: 2px 10px;
        border-radius: 0 0 8px 0;
      }
      .toolbar {
        display: flex;
        gap: 6px;
        padding: 6px 10px;
        margin-left: 88px;
      }
      .toolbar button {
        background: var(--parchment);
        border: 1.5px solid var(--ink);
        color: var(--ink);
        border-radius: 6px;
        padding: 3px 10px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        box-shadow: 0 2px 0 rgba(70, 53, 31, 0.35);
        transition: transform 0.05s ease;
      }
      .toolbar button:hover:not(:disabled) {
        background: #faf3e0;
      }
      .toolbar button:active:not(:disabled) {
        transform: translateY(1px);
        box-shadow: none;
      }
      .toolbar button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .toolbar button.active {
        border-color: var(--accent);
        color: var(--accent);
      }
      .sketch-svg {
        flex: 1;
        width: 100%;
        display: block;
        cursor: crosshair;
        user-select: none;
        -webkit-user-select: none;
      }
      .sketch-bg {
        fill: var(--parchment);
      }
      /* the pen line: sepia, like a mapmaker's ink */
      .sketch-path {
        fill: none;
        stroke: var(--accent);
        stroke-width: 0.4;
        stroke-linejoin: round;
      }
      /* dots are the cartographer's coins */
      .dot {
        fill: var(--coin);
        stroke: var(--parchment);
        stroke-width: 0.15;
        cursor: grab;
      }
      .placeholder {
        margin: auto;
        padding: 48px;
        color: var(--ink-faint);
        font-style: italic;
        font-size: 13px;
        letter-spacing: 0.02em;
      }

      .fourier-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .fourier-canvas {
        flex: 1;
        width: 100%;
        min-height: 0;
        display: block;
      }
      .circles-slider {
        flex: 1;
        accent-color: var(--accent);
      }
      .slider-label {
        align-self: center;
        color: var(--ink-faint);
        font-size: 12px;
      }
      .count-label {
        align-self: center;
        min-width: 3ch;
        text-align: right;
        color: var(--accent);
      }

      .terms-scroll {
        flex: 1;
        overflow-y: auto;
      }
      .term-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      .term-table th {
        position: sticky;
        /* sticky rows scroll with the table, body slides underneath */
        background: var(--parchment);
        color: var(--ink-faint);
        font-variant-caps: small-caps;
        letter-spacing: 0.08em;
        text-align: left;
        padding: 4px 10px;
        font-weight: normal;
        z-index: 1;
      }
      /* title band of the header stack */
      .term-table thead tr:first-child th {
        top: 0;
        height: 26px;
        box-sizing: border-box;
        padding: 5px 10px;
        font-size: 12px;
        line-height: 16px;
        letter-spacing: 0.18em;
      }
      /* column headers stick directly beneath the title band */
      .term-table thead tr + tr th {
        top: 27px;
      }
      .term-table td {
        padding: 2px 10px;
        border-top: 1px solid var(--parchment-dark);
        white-space: nowrap;
      }
      .term-table tr.cut {
        opacity: 0.32;
      }
      .spark {
        width: 108px;
        height: 16px;
        display: block;
      }
      /* waveforms drawn in water-wash, like rivers on the map */
      .spark path {
        fill: none;
        stroke: var(--water);
        stroke-width: 1;
      }
    </style>
  </head>
  <body>
    <div class="sheet">
      <div class="page-title">f-sketch</div>
      <div id="app"></div>
    </div>
    <script type="module">
      import { main } from "/build/dev/javascript/fourier_sketch/fourier_sketch.mjs";
      main();
    </script>
  </body>
