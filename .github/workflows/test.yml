name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [fourier_sketch, fourier_toy]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.19.2"
          rebar3-version: "3"
      - run: gleam deps download
      # House truth is the JavaScript target everywhere
      # (fourier_sketch/docs/PLAN.md §2).
      - run: gleam test --target javascript
      - run: gleam format --check src test