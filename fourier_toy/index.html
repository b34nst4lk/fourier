<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fourier toy — the quaver</title>
<style>
:root {
  color-scheme: light;
  --ink: #111;
  --paper: #fbfbfb;
  --card: #fff;
  --line: #e5e5e5;
  --mut: #6b6b6b;
  --ok: #4a7a5a;
  /* the dial kinds' ink — one colour per KIND, never per slot index. These
     are fourier_toy_ffi.mjs PALETTES.light's term colours (the canvas and the
     page must agree): the radius yellow is the print-yellow DARKENED until
     its TEXT clears 4.5:1 on this paper (4.75:1), because #c9a411 is 2.31:1
     here — unreadable. */
  --term-phase: #c8321e;
  --term-radius: #8a6d00;
  --term-k: #1f5fae;
  --term-fixed: #6b6b6b;
}
body[data-theme="dark"] {
  color-scheme: dark;
  --ink: #f5f5f5;
  --paper: #0b0b0b;
  --card: #151515;
  --line: #2a2a2a;
  --mut: #9a9a9a;
  --ok: #7fbf94;
  --term-phase: #e05a4a;
  --term-radius: #ffd93d;
  --term-k: #5aa0e8;
  --term-fixed: #9a9a9a;
}
* { box-sizing: border-box; }
body {
  max-width: 430px;
  margin: 0 auto;
  padding: 14px;
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--paper);
}
.bar { display: flex; justify-content: space-between; align-items: center; margin: 0 0 6px; }
.tools { display: flex; gap: 6px; align-items: center; }
/* icon chips: compact square buttons, inline stroke SVGs inked via currentColor */
.chip {
  width: auto;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 5px;
  border: 1.5px solid var(--line); border-radius: 6px;
  background: var(--card); color: var(--ink); cursor: pointer;
}
.chip .icon { display: block; width: 16px; height: 16px; }
.chip .icon path, .chip .icon circle, .chip .icon line, .chip .icon polyline {
  stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round;
}
.pt { margin: 0 0 8px; font-size: 1rem; }
/* the daily puzzle's date: faint, beside the name (the fallback has none) */
.pt .when { color: var(--mut); font-size: .85rem; font-weight: 400; }
.score { font-size: .92rem; }
.score b { font-size: 1.25rem; }
.score .mv { color: var(--mut); font-size: .82rem; margin-left: 6px; }
.score .ok { display: none; color: var(--ok); font-weight: 600; margin-left: 8px; }
.score.solved .ok { display: inline; }
.score.solved b { color: var(--ok); }
.board {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  margin: 0 0 10px;
  /* stray double-taps on the play surface must not zoom either */
  touch-action: manipulation;
}
.rows { display: grid; gap: 8px; margin: 0 0 12px; }
.row {
  display: grid;
  grid-template-columns: 1fr 52px 76px 52px;
  gap: 6px;
  align-items: stretch;
}
.id { display: flex; flex-direction: column; justify-content: center; font-size: .9rem; }
.id .term { font-variant-numeric: tabular-nums; }
.id .sub { font-size: .7rem; color: var(--mut); }
button {
  font: inherit; font-size: 1.35rem; width: 100%;
  border: 1.5px solid var(--line); border-radius: 10px;
  background: var(--card); color: var(--ink); cursor: pointer;
  /* rapid stepper taps must not trigger double-tap zoom; pinch stays */
  touch-action: manipulation;
  /* long-press on a stepper is hold-to-repeat, never the text-selection
     loupe (mobile browsers would otherwise steal the pointer mid-hold) */
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
button:active { background: #ededed; }
body[data-theme="dark"] button:active { background: #232323; }
button:disabled { opacity: .35; cursor: default; }
/* dial readouts: plain text, centered in the grid cell — no box */
.val {
  display: flex; align-items: center; justify-content: center;
  font-size: 1.02rem;
}
/* the row's ink follows its dial KIND (puzzle.kind_class): the readout and
   its small print wear the same colour as that term's orbit on the canvas.
   Applied per kind, not per slot — a rearranged puzzle keeps its colours. */
.kind-phase .val, .kind-phase .term, .kind-phase .sub { color: var(--term-phase); }
.kind-radius .val, .kind-radius .term, .kind-radius .sub { color: var(--term-radius); }
.kind-k .val, .kind-k .term, .kind-k .sub { color: var(--term-k); }
.kind-fixed .val, .kind-fixed .term, .kind-fixed .sub { color: var(--term-fixed); }
.kind-phase .val, .kind-radius .val, .kind-k .val { font-weight: 600; }
.kind-fixed .val { font-weight: 400; }
</style>
</head>
<body data-theme="light">
<main id="app"></main>
<script type="module"></script>
</body>
</html>
