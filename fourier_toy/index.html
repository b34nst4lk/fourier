<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doodle — the daily doodle</title>
<style>
:root {
  color-scheme: light;
  --ink: #111;
  --paper: #fbfbfb;
  --card: #fff;
  --line: #e5e5e5;
  --mut: #6b6b6b;
  --ok: #4a7a5a;
  /* the dial columns' ink — one colour per CHAIN POSITION (1st dialed term,
     2nd, 3rd), never per dial KIND: colour answers "which wheel in the
     chain?", never "what does it do?" (the glyphs answer that). These are
     fourier_toy_ffi.mjs PALETTES' ordinal entries — the page and the canvas
     must agree. The middle yellow is the print-yellow DARKENED until its
     TEXT clears 4.5:1 on this paper (4.75:1), because #c9a411 is 2.31:1
     here — unreadable. */
  --ord-0: #c8321e;
  --ord-1: #8a6d00;
  --ord-2: #1f5fae;
}
body[data-theme="dark"] {
  color-scheme: dark;
  --ink: #f5f5f5;
  --paper: #0b0b0b;
  --card: #151515;
  --line: #2a2a2a;
  --mut: #9a9a9a;
  --ok: #7fbf94;
  --ord-0: #e05a4a;
  --ord-1: #ffd93d;
  --ord-2: #5aa0e8;
}
* { box-sizing: border-box; }
body {
  max-width: 430px;
  margin: 0 auto;
  padding: 14px;
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--paper);
}
.bar { display: flex; justify-content: space-between; align-items: center; margin: 0 0 6px; }
/* the wordmark: Doodle with the custom e — the svg strokes currentColor and
   follows the theme for free */
.brand { margin: 2px 0 4px; }
.brand .wm {
  font-weight: 700;
  font-size: 1.12rem;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.brand svg.e {
  display: inline-block;
  height: 0.64em;
  margin-left: 1px;
  vertical-align: -0.06em;
  fill: none;
  stroke: currentColor;
  stroke-width: 13;
  stroke-linecap: round;
}
.tools { display: flex; gap: 6px; align-items: center; }
/* icon chips: compact square buttons, inline stroke SVGs inked via currentColor */
.chip {
  width: auto;
  display: inline-flex; align-items: center; justify-content: center;
  /* a real touch target (PLAN-legibility-pass §2): 20px icon + 2×9 padding
     + 2×1.5 border = 41px, so the corner chips are thumb-sized, not hairline */
  padding: 9px;
  min-width: 40px; min-height: 40px;
  border: 1.5px solid var(--line); border-radius: 6px;
  background: var(--card); color: var(--ink); cursor: pointer;
}
.chip .icon { display: block; width: 20px; height: 20px; }
.chip .icon path, .chip .icon circle, .chip .icon line, .chip .icon polyline,
.chip .icon polygon {
  stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round;
}
.pt { margin: 0 0 8px; font-size: 1rem; }
/* the daily puzzle's date: faint, beside the name (the fallback has none) */
.pt .when { color: var(--mut); font-size: .85rem; font-weight: 400; }
.score { font-size: .92rem; }
.score b { font-size: 1.25rem; }
.score .mv { color: var(--mut); font-size: .82rem; margin-left: 6px; }
.score .ok { display: none; color: var(--ok); font-weight: 600; margin-left: 8px; }
.score.solved .ok { display: inline; }
.score.solved b { color: var(--ok); }
.board {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  margin: 0 0 10px;
  /* stray double-taps on the play surface must not zoom either */
  touch-action: manipulation;
}
/* the dial columns: three wheels under the board, one per dialed term in
   chain order. Each column is [glyph ↑][circle space][glyph ↓] and carries
   NO text: the column's ink is its ordinal, the glyph says what it does. */
.cols {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 0 0 12px;
}
.col { display: flex; flex-direction: column; gap: 2px; }
.col:nth-child(1) { color: var(--ord-0); }
.col:nth-child(2) { color: var(--ord-1); }
.col:nth-child(3) { color: var(--ord-2); }
.col canvas { display: block; width: 100%; height: 104px; }
button {
  font: inherit; font-size: 1.35rem; width: 100%;
  border: 1.5px solid var(--line); border-radius: 10px;
  background: var(--card); color: var(--ink); cursor: pointer;
  /* rapid stepper taps must not trigger double-tap zoom; pinch stays */
  touch-action: manipulation;
  /* long-press on a stepper is hold-to-repeat, never the text-selection
     loupe (mobile browsers would otherwise steal the pointer mid-hold) */
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
button:active { background: #ededed; }
body[data-theme="dark"] button:active { background: #232323; }
button:disabled { opacity: .35; cursor: default; }
/* glyph buttons: icon-only, but real BUTTONS — they keep the global button
   chrome (line border, 10px radius, card fill — what the retired +/− steppers
   wore) and only override what icon-only needs. The column's ordinal ink
   reaches the svg through currentColor, so a column and its circle agree. */
.glyph {
  color: inherit;
  padding: 4px 0;
  display: flex; align-items: center; justify-content: center;
}
.glyph .icon { width: 20px; height: 20px; }
.glyph .icon path, .glyph .icon polyline, .glyph .icon polygon, .glyph .icon line {
  stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round;
  stroke-linejoin: round;
}
</style>
</head>
<body data-theme="light">
<main id="app"></main>
<script type="module"></script>
</body>
</html>
