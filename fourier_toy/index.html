<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fourier toy — the quaver</title>
<style>
:root {
  --ink: #463521;
  --paper: #faf3e3;
  --card: #fffdf6;
  --line: #d9c9a8;
  --mut: #79714f;
  --route: #a4372a;
  --ok: #3d7a3d;
}
body[data-theme="dark"] {
  --ink: #eaddb4;
  --paper: #241d12;
  --card: #2e2618;
  --line: #4a3e2a;
  --mut: #a89771;
  --route: #d05848;
  --ok: #8fd08f;
}
* { box-sizing: border-box; }
body {
  max-width: 430px;
  margin: 0 auto;
  padding: 14px;
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--paper);
}
.bar { display: flex; justify-content: space-between; align-items: center; margin: 0 0 6px; }
/* corner-chip toggle, icon-only: inline SVG inked via currentColor */
.theme {
  width: auto;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 5px;
  border: 1.5px solid var(--line); border-radius: 6px;
  background: var(--card); color: var(--ink); cursor: pointer;
}
.theme .icon { display: block; width: 16px; height: 16px; }
.theme .icon path, .theme .icon circle, .theme .icon line {
  stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round;
}
.pt { margin: 0 0 8px; font-size: 1rem; }
.score { font-size: .92rem; }
.score b { font-size: 1.25rem; }
.score .ok { display: none; color: var(--ok); font-weight: 600; margin-left: 8px; }
.score.solved .ok { display: inline; }
.score.solved b { color: var(--ok); }
.board {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  margin: 0 0 10px;
  /* stray double-taps on the play surface must not zoom either */
  touch-action: manipulation;
}
.rows { display: grid; gap: 8px; margin: 0 0 12px; }
.row {
  display: grid;
  grid-template-columns: 1fr 52px 76px 52px;
  gap: 6px;
  align-items: stretch;
}
.id { display: flex; flex-direction: column; justify-content: center; font-size: .9rem; }
.id .term { }
.id .sub { font-size: .7rem; color: var(--mut); }
button {
  font: inherit; font-size: 1.35rem; width: 100%;
  border: 1.5px solid var(--line); border-radius: 10px;
  background: var(--card); color: var(--ink); cursor: pointer;
  /* rapid stepper taps must not trigger double-tap zoom; pinch stays */
  touch-action: manipulation;
}
button:active { background: #f1e4c8; }
body[data-theme="dark"] button:active { background: #3d321f; }
button:disabled { opacity: .35; cursor: default; }
.val {
  display: flex; align-items: center; justify-content: center;
  font-size: 1.02rem;
  border: 1.5px solid var(--line); border-radius: 10px;
  background: var(--card);
}
.reset { width: 100%; padding: 10px; font-size: 1rem; }
</style>
</head>
<body data-theme="light">
<main id="app"></main>
<script type="module"></script>
</body>
</html>
