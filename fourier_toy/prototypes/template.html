<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fourier toy — prototypes</title>
<style>
:root {
  --ink: #463521;
  --paper: #faf3e3;
  --card: #fffdf6;
  --line: #d9c9a8;
  --mut: #79714f;
  --route: #a4372a;
  --ghost: #86613f;
  --ok: #3d7a3d;
}
* { box-sizing: border-box; }
body {
  max-width: 430px;
  margin: 0 auto;
  padding: 14px;
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--paper);
}
h1 { font-size: 1.15rem; margin: 0 0 10px; letter-spacing: .01em; }
h1 span { color: #8a6a3a; font-weight: 400; font-size: .8em; }
.intro { font-size: .92rem; margin: 0 0 12px; }
.card {
  display: block;
  margin: 0 0 8px;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  color: inherit;
  text-decoration: none;
  background: var(--card);
}
.card b { display: block; font-size: 1.02rem; }
.card span { font-size: .85rem; color: var(--mut); }
.note { font-size: .8rem; color: var(--mut); margin: 14px 0 0; }
.bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 0 0 6px;
}
.back { color: #8a6a3a; text-decoration: none; font-size: .9rem; }
.pt { margin: 0 0 8px; font-size: 1rem; }
.score { font-size: .92rem; }
.score b { font-size: 1.25rem; }
.score .ok { display: none; color: var(--ok); font-weight: 600; margin-left: 8px; }
.score.solved .ok { display: inline; }
.score.solved b { color: var(--ok); }
.board {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  margin: 0 0 10px;
}
.board .t { fill: none; stroke: var(--ghost); stroke-width: 1.6; stroke-dasharray: 3 2.6; opacity: .55; }
.board .c { fill: none; stroke: var(--route); stroke-width: 2; stroke-linejoin: round; }
.rows { display: grid; gap: 8px; margin: 0 0 12px; }
.row {
  display: grid;
  grid-template-columns: 1fr 52px 76px 52px;
  gap: 6px;
  align-items: stretch;
}
.id {
  display: flex;
  flex-direction: column;
  justify-content: center;
  font-size: .9rem;
}
.id .sub { font-size: .72rem; color: var(--mut); }
button {
  font: inherit;
  font-size: 1.35rem;
  width: 100%;
  padding: 0;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  color: var(--ink);
  cursor: pointer;
}
button:active { background: #f1e4c8; }
button:disabled { opacity: .35; cursor: default; }
.val {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.02rem;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: var(--card);
}
.reset { width: 100%; padding: 10px; font-size: 1rem; }
</style>
</head>
<body>
<h1>fourier toy <span>prototype round</span></h1>
<main id="app"></main>
<script type="module">
{{APP_JS}}
</script>
</body>
</html>
