# toy_admin — the only service here (PLAN-daily-puzzles.md §3 Q13).
#
# Deploy is `docker compose up -d --build` on the home box, driven by the
# cloudflared tunnel: the ingress rule `^/api(/.*)?$ -> http://toy_admin:8080`
# resolves the container by name across home_server-network, so NO host ports
# are published — the tunnel is the only ingress.
#
#   cd toy_admin && docker compose up -d --build
#
# The build context is the umbrella root (..), because the math core arrives as
# a path dependency on ../fourier_sketch. See ../.dockerignore.

name: toy_admin

services:
  toy_admin:
    build:
      context: ..
      dockerfile: toy_admin/Dockerfile
    image: toy_admin:latest
    container_name: toy_admin
    environment:
      # The wisp app binds 0.0.0.0 and reads PORT (8080 default in code too).
      PORT: "8080"
      # Where the SQLite file lives (store.database_path_env). Inside the
      # volume, so puzzles and attempts survive `up -d --build` and restarts;
      # the app runs schema migrations (CREATE ... IF NOT EXISTS) at boot.
      DB_PATH: /app/data/toy_admin.sqlite3
      # The request fences (throttle.gleam). Unset = the plan's defaults:
      # 20 solves per uuid per 5 minutes, 60 per IP per 5 minutes. Set either
      # window to tune; a non-positive value falls back to the default rather
      # than switching the fence off.
      # THROTTLE_UUID_LIMIT: "20"
      # THROTTLE_UUID_WINDOW_SECONDS: "300"
      # THROTTLE_IP_LIMIT: "60"
      # THROTTLE_IP_WINDOW_SECONDS: "300"
      # The admin fence (access.gleam, PLAN §9). Set it to the Cloudflare Access
      # application's AUD tag (Access dashboard -> the app -> "Audience tag").
      # UNSET (or blank) = presence-only: /api/admin/* still demands a
      # Cf-Access-Jwt-Assertion header, but its audience and expiry are not
      # checked, and the app says so once at boot (logger warning). Set it.
      # ADMIN_ACCESS_AUD: "<the Access app's AUD tag>"
    volumes:
      # Named volume, not a bind mount: the database is the container's own
      # state and must survive `up --build` (which recreates the container)
      # and not appear in the repo checkout. Inspect it with
      #   docker compose exec toy_admin ...
      # or `docker volume inspect toy_admin_toy_admin-data`.
      - toy_admin-data:/app/data
    networks:
      - home_server-network
    restart: unless-stopped

volumes:
  toy_admin-data:

networks:
  # The tunnel's network, created by the HOME SERVER's own compose project —
  # docker therefore knows it as `home_server_home_server-network` (project
  # prefix). The external name is pinned here so this file can keep the
  # plan's logical name; nothing creates or removes this network.
  home_server-network:
    external: true
    name: home_server_home_server-network
